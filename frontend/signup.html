<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلمنا — إنشاء حساب جديد</title>
  <meta name="description" content="كلمنا — إنشاء حساب جديد في نظام الدعم الذكي المدعوم بالذكاء الاصطناعي.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body style="overflow-y: auto;">

  <canvas id="particles-canvas"></canvas>

  <div class="auth-page">
    <!-- Floating Decorative Orbs -->
    <div class="auth-orb auth-orb--1"></div>
    <div class="auth-orb auth-orb--2"></div>
    <div class="auth-orb auth-orb--3"></div>

    <div class="auth-card" id="auth-card">
      <!-- Logo -->
      <div class="auth-card__logo">
        <div class="auth-card__logo-icon">ك</div>
        <h1 class="auth-card__logo-text">كلمنا</h1>
        <p class="auth-card__logo-subtitle">الدعم الذكي بالذكاء الاصطناعي</p>
      </div>

      <!-- Title -->
      <h2 class="auth-card__title">إنشاء حساب جديد ✨</h2>
      <p class="auth-card__desc">انضم إلينا واستفد من الدعم الذكي</p>

      <!-- Error Message -->
      <div class="auth-error" id="auth-error" style="display: none;">
        <span class="auth-error__icon">⚠️</span>
        <span class="auth-error__text" id="auth-error-text"></span>
      </div>

      <!-- Success Message -->
      <div class="auth-success" id="auth-success" style="display: none;">
        <span class="auth-success__icon">✅</span>
        <span class="auth-success__text" id="auth-success-text"></span>
      </div>

      <!-- Signup Form -->
      <form class="auth-form" id="signup-form" autocomplete="on">
        <div class="auth-form__group">
          <label class="auth-form__label" for="signup-username">اسم المستخدم</label>
          <div class="auth-form__input-wrapper">
            <span class="auth-form__input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input
              type="text"
              class="auth-form__input"
              id="signup-username"
              name="username"
              placeholder="اختر اسم المستخدم"
              required
              autocomplete="username"
              minlength="3"
            >
          </div>
        </div>

        <div class="auth-form__group">
          <label class="auth-form__label" for="signup-password">كلمة المرور</label>
          <div class="auth-form__input-wrapper">
            <span class="auth-form__input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              class="auth-form__input"
              id="signup-password"
              name="password"
              placeholder="أدخل كلمة المرور (6 أحرف على الأقل)"
              required
              autocomplete="new-password"
              minlength="6"
            >
            <button type="button" class="auth-form__toggle-pass" id="toggle-password" aria-label="إظهار كلمة المرور">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <!-- Password Strength -->
          <div class="auth-form__strength" id="password-strength">
            <div class="auth-form__strength-bar">
              <div class="auth-form__strength-fill" id="strength-fill"></div>
            </div>
            <span class="auth-form__strength-label" id="strength-label"></span>
          </div>
        </div>

        <div class="auth-form__group">
          <label class="auth-form__label" for="signup-confirm-password">تأكيد كلمة المرور</label>
          <div class="auth-form__input-wrapper">
            <span class="auth-form__input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </span>
            <input
              type="password"
              class="auth-form__input"
              id="signup-confirm-password"
              name="confirm-password"
              placeholder="أعد كتابة كلمة المرور"
              required
              autocomplete="new-password"
            >
          </div>
        </div>

        <button type="submit" class="auth-form__submit" id="signup-submit">
          <span class="auth-form__submit-text">إنشاء الحساب</span>
          <span class="auth-form__submit-loader" style="display: none;">
            <span class="auth-spinner"></span>
          </span>
        </button>
      </form>

      <!-- Divider -->
      <div class="auth-divider">
        <span class="auth-divider__line"></span>
        <span class="auth-divider__text">أو</span>
        <span class="auth-divider__line"></span>
      </div>

      <!-- Google Sign-Up -->
      <button class="auth-google-btn" id="google-signup-btn">
        <svg class="auth-google-btn__icon" viewBox="0 0 24 24" width="20" height="20">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>التسجيل عبر Google</span>
      </button>

      <!-- Switch to Login -->
      <p class="auth-card__switch">
        لديك حساب بالفعل؟
        <a href="login.html" class="auth-card__switch-link">تسجيل الدخول</a>
      </p>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
