global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kalemna_backend_server
    scrape_interval: 5s
    static_configs:
      - targets: ["kalemna_backend:8000"]

  - job_name: vllm_server
    scrape_interval: 5s
    scheme: https
    static_configs:

      - targets: ['motor-syndrome-plate-cathedral.trycloudflare.com']

  - job_name: kalemna_server_hardware_monitoring
    scrape_interval: 5s
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: kalemna_postgres
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres_exporter:9187']