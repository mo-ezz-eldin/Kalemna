services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  kalemna_backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./onnx_intent_model:/kalemna_app/onnx_intent_model
      - ./onnx_sentiment_model:/kalemna_app/onnx_sentiment_model
    depends_on:
      - postgres

  kalmena_frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - kalemna_backend

volumes:
  postgres_data:


