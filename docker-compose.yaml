services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-kalemna_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  kalemna_backend:
    image: ${DOCKER_USERNAME:-mezz76748}/kalemna_backend:latest
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./onnx_intent_model:/kalemna_app/onnx_intent_model
      - ./onnx_sentiment_model:/kalemna_app/onnx_sentiment_model
    depends_on:
      - postgres
    command: gunicorn src.presentation.api.app:app --host 0.0.0.0 --port 8000 --workers 4

  kalmena_frontend:
    image: ${DOCKER_USERNAME:-mezz76748}/kalmena_frontend:latest
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - kalemna_backend

  prometheus_monitor:
    image: prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2

    ports:
      - "9090:9090"

    volumes:
      - prom_data:/prometheus
      - ./prometheus_config.yaml:/etc/prometheus/prometheus.yaml

    command:
      - '--config.file=/etc/prometheus/prometheus_config.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--enable-feature=envvar-expansion'
    depends_on:
      - kalemna_backend

  cadvisor:
      image: gcr.io/cadvisor/cadvisor:v0.49.1
      ports:
        - "8080:8080"
      volumes:
        - /:/rootfs:ro
        - /var/run:/var/run:rw
        - /sys:/sys:ro
        - /var/lib/docker/:/var/lib/docker:ro

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - postgres

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    logging:
      driver: "none"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus_monitor


volumes:
  postgres_data:


