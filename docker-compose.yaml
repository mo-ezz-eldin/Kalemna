services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-kalemna_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  kalemna_backend:
    image: ${DOCKER_USERNAME:-mezz76748}/kalemna_backend:latest
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./onnx_intent_model:/kalemna_app/onnx_intent_model
      - ./onnx_sentiment_model:/kalemna_app/onnx_sentiment_model
    depends_on:
      - postgres

  kalmena_frontend:
    image: ${DOCKER_USERNAME:-mezz76748}/kalmena_frontend:latest
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - kalemna_backend

volumes:
  postgres_data:


