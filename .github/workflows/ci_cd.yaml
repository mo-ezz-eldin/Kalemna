name: Backend CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff 

      - name: Ruff Lint Check
        run: ruff check src/ tests/

  test_app:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password_123
          POSTGRES_DB: test_db_kalmena
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests with Coverage
        env:

          TEST_DB_CONN: postgresql+asyncpg://postgres:ci_password_123@localhost:5432/test_db_kalmena
          POSTGRES_DB_CONN: postgresql+asyncpg://postgres:ci_password_123@localhost:5432/test_db_kalmena
          ALEMBIC_CONN: postgresql://postgres:ci_password_123@localhost:5432/test_db_kalmena


          INTENT_MODEL_PATH: /tmp/ci_dummy_path
          SENTIMENT_MODEL_PATH: /tmp/ci_dummy_path
          SENTIMENT_TOKENIZER: FacebookAI/roberta-base


          LANGCHAIN_TRACING_V2: "false"
          LANGCHAIN_PROJECT: ci_test_run
          LANGCHAIN_API_KEY: ci_dummy_key


          GEMINI_API_KEY: ci_dummy_key
          COHERE_API_KEY: ci_dummy_key

          SECRET_KEY: ci_test_secret_key_not_for_production
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"


          GITHUB_ACTIONS: "true"
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=70

  build_and_push_docker:
    runs-on: ubuntu-latest
    needs: test_app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test Docker Compose Build
        run: docker compose build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
           username: ${{ secrets.DOCKER_USERNAME }}
           password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        run: docker compose push