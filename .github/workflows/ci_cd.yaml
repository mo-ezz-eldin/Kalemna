name: Backend CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build_kalemna_app:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

  test_app:
    runs-on: ubuntu-latest
    needs: build_kalemna_app  

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password_123
          POSTGRES_DB: test_db_kalmena
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'  # هيسحب المكتبات من الكاش في ثانية ومش هيحملها من النت تاني

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # هنا بنحقن مسار الاتصال بداتابيز الـ CI عشان settings.py يقرأه
          TEST_DB_CONN: postgresql+asyncpg://postgres:ci_password_123@localhost:5432/test_db_kalmena
        run: pytest tests/

  # ==========================================
  # الجوب التالتة: بناء الـ Docker (والـ Push مستقبلاً)
  # ==========================================
  build_and_push_docker:
    runs-on: ubuntu-latest
    needs: test_app  # مش هيبني الدوكر إلا لو كل التستات نجحت 100%

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # هنا مش محتاجين بايثون خالص، لأن الدوكر بيبني البيئة بتاعته من ملف الـ Dockerfile
      - name: Test Docker Compose Build
        run: docker compose build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
           username: ${{ secrets.DOCKER_USERNAME }}
           password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        run: docker compose push